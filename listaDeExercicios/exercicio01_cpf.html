<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Validador de CPF</title>
<style>
  body { font-family: sans-serif; max-width: 400px; margin: 50px auto; text-align: center; }
  input { font-size: 18px; padding: 8px; width: 200px; text-align: center; }
  button { font-size: 16px; padding: 8px 16px; margin-left: 8px; cursor: pointer; }
  #resultado { margin-top: 20px; font-size: 20px; font-weight: bold; }
  .valido { color: green; }
  .invalido { color: red; }
</style>
</head>
<body>
  <h1>Validador de CPF</h1>
  <input type="text" id="cpfInput" placeholder="Digite o CPF" maxlength="14">
  <button id="btnValidar">Validar</button>
  <div id="resultado"></div>

  <script>
    function validarCPF(cpf) {
      cpf = cpf.replace(/[^\d]/g, "");

      if (cpf.length !== 11) return false;

      // CPFs com todos os dígitos iguais são inválidos (ex: 111.111.111-11)
      if (/^(\d)\1{10}$/.test(cpf)) return false;

      // Cálculo do 1º dígito verificador
      let soma = 0;
      for (let i = 0; i < 9; i++) {
        soma += parseInt(cpf[i]) * (10 - i);
      }
      let resto = (soma * 10) % 11;
      if (resto === 10) resto = 0;
      if (resto !== parseInt(cpf[9])) return false;

      // Cálculo do 2º dígito verificador
      soma = 0;
      for (let i = 0; i < 10; i++) {
        soma += parseInt(cpf[i]) * (11 - i);
      }
      resto = (soma * 10) % 11;
      if (resto === 10) resto = 0;
      if (resto !== parseInt(cpf[10])) return false;

      return true;
    }

    document.getElementById("btnValidar").addEventListener("click", () => {
      const cpf = document.getElementById("cpfInput").value;
      const resultadoDiv = document.getElementById("resultado");

      if (validarCPF(cpf)) {
        resultadoDiv.textContent = "CPF Válido ✅";
        resultadoDiv.className = "valido";
      } else {
        resultadoDiv.textContent = "CPF Inválido ❌";
        resultadoDiv.className = "invalido";
      }
    });
  </script>
</body>
</html>
