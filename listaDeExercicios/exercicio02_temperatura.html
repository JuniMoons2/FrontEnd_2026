<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Conversor de Temperatura</title>
<style>
  body { font-family: sans-serif; max-width: 400px; margin: 50px auto; text-align: center; }
  .campo { margin: 20px 0; }
  label { display: block; margin-bottom: 5px; font-weight: bold; }
  input { font-size: 20px; padding: 8px; width: 150px; text-align: center; }
</style>
</head>
<body>
  <h1>Conversor de Temperatura</h1>

  <div class="campo">
    <label for="celsius">Celsius (°C)</label>
    <input type="number" id="celsius" step="0.1" placeholder="0.0">
  </div>

  <div class="campo">
    <label for="fahrenheit">Fahrenheit (°F)</label>
    <input type="number" id="fahrenheit" step="0.1" placeholder="0.0">
  </div>

  <script>
    const celsiusInput = document.getElementById("celsius");
    const fahrenheitInput = document.getElementById("fahrenheit");

    celsiusInput.addEventListener("input", () => {
      const c = parseFloat(celsiusInput.value);
      if (isNaN(c)) {
        fahrenheitInput.value = "";
        return;
      }
      const f = (c * 9 / 5) + 32;
      fahrenheitInput.value = f.toFixed(2);
    });

    fahrenheitInput.addEventListener("input", () => {
      const f = parseFloat(fahrenheitInput.value);
      if (isNaN(f)) {
        celsiusInput.value = "";
        return;
      }
      const c = (f - 32) * 5 / 9;
      celsiusInput.value = c.toFixed(2);
    });
  </script>
</body>
</html>
