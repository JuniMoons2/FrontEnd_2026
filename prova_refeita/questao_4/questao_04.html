<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 04 — Jogadores</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f0f4f8;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* ---------- Cabeçalho ---------- */
        .page-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 40px;
        }

        .page-header img {
            height: 60px;
        }

        .page-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1a3a6e;
            margin: 0;
        }

        .player-card {
            background: #ffffff;
            border-radius: 16px;
            border: 2px solid #d0e1f9;
            box-shadow: 0 6px 20px rgba(0,0,0,0.10);
            width: 260px;
            overflow: hidden;
            transition: transform 0.25s, box-shadow 0.25s;
        }

        .player-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 32px rgba(0,0,0,0.18);
        }

        .card-header-strip {
            background: linear-gradient(135deg, #1a3a6e, #2563ab);
            height: 10px;
        }

        .player-card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            object-position: top;
        }

        .card-body-custom {
            padding: 16px;
        }

        .player-name {
            font-size: 1rem;
            font-weight: 700;
            color: #1a3a6e;
            margin-bottom: 10px;
            border-bottom: 2px solid #eef4ff;
            padding-bottom: 8px;
        }

        .player-info {
            font-size: 0.85rem;
            color: #444;
            margin-bottom: 4px;
        }

        .player-info span {
            font-weight: 600;
            color: #1a3a6e;
        }

        .rank-badge {
            display: inline-block;
            background-color: #f5a623;
            color: #1a1a1a;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 3px 10px;
            border-radius: 20px;
            margin-top: 8px;
        }

        .btn-adicionar {
            background-color: #1a3a6e;
            color: #ffffff;
            border: none;
            border-radius: 30px;
            padding: 12px 36px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: background-color 0.2s, transform 0.2s;
        }

        .btn-adicionar:hover {
            background-color: #2563ab;
            transform: scale(1.04);
        }
    </style>
</head>
<body>

    <div class="page-header">
        <img src="img/FIFA-World-Cup-26.jpg" alt="Copa 2026" onerror="this.style.display='none'">
        <h1>⚽ Elenco — Copa do Mundo 2026</h1>
    </div>

    <div class="mb-4">
        <button class="btn-adicionar" onclick="add()">Adicionar Novo Jogador</button>
    </div>

    <div id="cards-container" class="d-flex flex-wrap gap-4 align-items-start">

        <!-- ===== CARD ORIGINAL — Vinicius Júnior ===== -->
        <div class="player-card">
            <div class="card-header-strip"></div>
            <img src="img/_vinicius_junior.png" alt="Vinicius Júnior">
            <div class="card-body-custom">
                <div class="player-name">Vinicius José Paaixão de Oliveira Júnior</div>

                <p class="player-info">📅 <span id="nascimento-vini">12/07/2000</span> (24 anos)</p>
                <p class="player-info">📏 Altura: <span id="altura-vini">1,76 m</span></p>
                <p class="player-info">🏃 Posição: <span id="posicao-vini">Atacante</span></p>

                <div class="rank-badge">⭐ Rank: <span id="rank-vini">9.2</span></div>
            </div>
        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
